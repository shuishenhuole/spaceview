name: SpaceView Build & Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# 默认只读;创建 Release 的 job 单独提升为 write
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_NAME: SpaceView

# PR 上连续推送时取消旧任务;master 上的发布任务不取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos
            # macos-latest 为 Apple Silicon(arm64)runner
            arch: aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows
            arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --verbose --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --verbose

      - name: Resolve binary and artifact name
        id: artifact
        shell: bash
        run: |
          # Windows runner 上 cargo/jq 可能输出 CRLF,去掉 \r 避免污染产物名
          BIN=$(cargo read-manifest | jq -r '.name' | tr -d '\r')
          echo "BIN=$BIN" >> "$GITHUB_OUTPUT"
          echo "NAME=${BIN}-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"

      - name: Package (Linux / macOS)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/${{ steps.artifact.outputs.NAME }}" \
            -C "target/${{ matrix.target }}/release" \
            "${{ steps.artifact.outputs.BIN }}"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/${{ steps.artifact.outputs.BIN }}.exe" `
            -DestinationPath "dist/${{ steps.artifact.outputs.NAME }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.NAME }}
          path: dist/${{ steps.artifact.outputs.NAME }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release ${{ env.RELEASE_NAME }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: auto-release-${{ github.sha }}
          files: artifacts/*/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
