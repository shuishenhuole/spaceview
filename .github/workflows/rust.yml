name: Rust Build & Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RELEASE_NAME: Rust

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Set artifact name
        id: artifact_name
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            echo "NAME=${{ github.event.repository.name }}-linux-x86_64.tar.gz" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            echo "NAME=${{ github.event.repository.name }}-macos-x86_64.tar.gz" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            echo "NAME=${{ github.event.repository.name }}-windows-x86_64.zip" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Package Linux / macOS
        if: matrix.os != 'windows-latest'
        run: |
          cd target/release
          tar -czf ${{ steps.artifact_name.outputs.NAME }} ${{ github.event.repository.name }}
          mv ${{ steps.artifact_name.outputs.NAME }} ../../

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          cd target/release
          Compress-Archive -Path ${{ github.event.repository.name }}.exe -DestinationPath ../../${{ steps.artifact_name.outputs.NAME }}
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.NAME }}
          path: ${{ steps.artifact_name.outputs.NAME }}

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release ${{ env.RELEASE_NAME }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: auto-release-${{ github.sha }}
          files: artifacts/*/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
