name: Rust Build & Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RELEASE_NAME: SpaceView

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            arch: x86_64
            runner: ubuntu-latest
          - os: macos
            arch: aarch64
            runner: macos-14
          - os: windows
            arch: x86_64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: ${{ matrix.os }}-${{ matrix.arch }}-unknown-${{ matrix.os == 'macos' && 'darwin' || matrix.os == 'ubuntu' && 'linux-gnu' || 'msvc' }}

      - name: Build release binary
        run: cargo build --release --verbose --target ${{ matrix.os }}-${{ matrix.arch }}-unknown-${{ matrix.os == 'macos' && 'darwin' || matrix.os == 'ubuntu' && 'linux-gnu' || 'msvc' }}

      - name: Run tests
        run: cargo test --verbose

      - name: Get binary name
        id: bin_name
        run: |
          cargo read-manifest | jq -r '.name' > binname.txt
          echo "BIN=$(cat binname.txt)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set artifact name
        id: artifact_name
        run: |
          BIN=${{ steps.bin_name.outputs.BIN }}
          if [[ "${{ matrix.os }}" == "ubuntu" ]]; then
            echo "NAME=${BIN}-linux-${{ matrix.arch }}.tar.gz" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.os }}" == "macos" ]]; then
            echo "NAME=${BIN}-macos-${{ matrix.arch }}.tar.gz" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.os }}" == "windows" ]]; then
            echo "NAME=${BIN}-windows-${{ matrix.arch }}.zip" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Package Linux / macOS
        if: matrix.os != 'windows'
        run: |
          BIN=${{ steps.bin_name.outputs.BIN }}
          TARGET_DIR=target/${{ matrix.os }}-${{ matrix.arch }}-unknown-${{ matrix.os == 'macos' && 'darwin' || matrix.os == 'ubuntu' && 'linux-gnu' || 'msvc' }}/release
          cd $TARGET_DIR
          tar -czf ${{ steps.artifact_name.outputs.NAME }} $BIN
          mv ${{ steps.artifact_name.outputs.NAME }} ../../../../
        shell: bash

      - name: Package Windows
        if: matrix.os == 'windows'
        run: |
          $BIN = "${{ steps.bin_name.outputs.BIN }}"
          $TARGET_DIR = "target/${{ matrix.os }}-${{ matrix.arch }}-unknown-msvc/release"
          cd $TARGET_DIR
          Compress-Archive -Path "$BIN.exe" -DestinationPath "../../../../${{ steps.artifact_name.outputs.NAME }}"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.NAME }}
          path: ${{ steps.artifact_name.outputs.NAME }}

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release ${{ env.RELEASE_NAME }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: auto-release-${{ github.sha }}
          files: artifacts/*/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
